name: sa-ping
on: workflow_dispatch
permissions:
  issues: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Comment as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/issues/1/comments" -f body='@cdh5mcv6ty-hue 请修复 README.md 里的拼写错误：第一行的 "hellow" 应改为 "hello"。'
